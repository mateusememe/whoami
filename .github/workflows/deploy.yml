name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly rebuild, so the GitHub numbers (stars, last push, languages) stay current.
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Refreshes src/data/github-*.ts for this build only; keeps the committed snapshot on failure.
      - name: Sync GitHub stars, pushes and languages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run github:sync

      - name: Build production bundle
        env:
          VITE_BASE_PATH: /whoami/
          VITE_SITE_URL: https://mateusememe.github.io/whoami
          # GoatCounter endpoint (https://<code>.goatcounter.com/count); empty leaves analytics off.
          VITE_GOATCOUNTER_URL: ${{ vars.GOATCOUNTER_URL }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
