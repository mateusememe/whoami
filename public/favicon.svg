<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#141418"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&amp;display=swap');
    .bg {
      fill: url(#bgGrad);
      rx: 16px;
    }
    .border {
      fill: none;
      stroke: rgba(255, 255, 255, 0.16);
      stroke-width: 1.5px;
      rx: 15px;
    }
    .text {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.05em;
      fill: url(#textGrad);
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>
  <rect width="64" height="64" class="bg"/>
  <rect x="1" y="1" width="62" height="62" class="border"/>
  <text x="32" y="33.5" class="text">MM</text>
</svg>
